<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F6F9" />
    <title>GenVar</title>
    <link rel="icon" type="image/svg+xml" href="/brand/genvar-mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/genvar-mark-32.png" />
    <link rel="apple-touch-icon" href="/brand/genvar-mark-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica o modo de cor antes da primeira pintura: sem isto a pagina
      // aparece clara e so escurece quando o React monta. So a classe entra
      // aqui; a barra do navegador e ajustada depois, quando o CSS ja chegou.
      (function () {
        try {
          var m = localStorage.getItem('genvar-color-mode')
          if (m !== 'light' && m !== 'dark') {
            m = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          if (m === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
