[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Por padrao a suite NAO roda os testes de integracao. Eles batem em Ensembl,
# gnomAD, ClinVar e MyVariant de verdade, entao reprovam quando um servico de
# terceiro muda de contrato, fica fora do ar ou limita a taxa, e nada disso diz
# alguma coisa sobre o codigo daqui. Continuam existindo e valem: sao o unico
# jeito de descobrir que um contrato externo mudou. So nao podem decidir se o
# build passa.
#
#   pytest                      unitarios, sem rede
#   pytest -m integration       so os de contrato externo
#   pytest -m ""                todos
addopts = -m "not integration"

markers =
    integration: chama uma API externa de verdade; exige rede e tolera falha alheia
