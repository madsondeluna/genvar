<svg xmlns="http://www.w3.org/2000/svg" width="910" height="1180" viewBox="0 0 910 1180" font-family="Helvetica, Arial, sans-serif"><rect width="910" height="1180" fill="#ffffff"/><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#555555"/></marker><marker id="arrS" markerWidth="9" markerHeight="9" refX="0.5" refY="3.2" orient="auto" markerUnits="userSpaceOnUse"><path d="M8,0 L0,3.2 L8,6.4 z" fill="#555555"/></marker></defs>
<text x="380" y="38" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#222222" text-anchor="middle">GenVar 3.0 — Fluxo da requisição /api/gene/{símbolo}</text>
<text x="380" y="58" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">Ciclo de vida de uma chamada no servidor</text>
<rect x="200" y="70" width="200" height="46" rx="12" ry="12" fill="#f5f5f5" stroke="#666666" stroke-width="1.6"/>
<text x="300.0" y="89.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">Navegador</text>
<text x="300.0" y="105.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#222222" text-anchor="middle">GET /api/gene/{símbolo}</text>
<rect x="180" y="150" width="240" height="54" rx="4" ry="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1.6"/>
<text x="300.0" y="181.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">Backend valida o símbolo</text>
<polygon points="300.0,240 365,292.0 300.0,344 235,292.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.6"/>
<text x="300.0" y="288.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">Em cache?</text>
<text x="300.0" y="304.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#222222" text-anchor="middle">(Redis)</text>
<rect x="20" y="262" width="160" height="58" rx="4" ry="4" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.6"/>
<text x="100.0" y="287.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">Resposta do cache</text>
<text x="100.0" y="303.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#222222" text-anchor="middle">entrega imediata</text>
<rect x="180" y="390" width="240" height="58" rx="4" ry="4" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.6"/>
<text x="300.0" y="407.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">Ensembl</text>
<text x="300.0" y="423.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#222222" text-anchor="middle">lookup do gene, devolve gene_id</text>
<text x="300.0" y="439.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#222222" text-anchor="middle">(sequencial)</text>
<rect x="120" y="486" width="360" height="40" rx="20.0" ry="20.0" fill="#d5e8d4" stroke="#82b366" stroke-width="1.6"/>
<text x="300.0" y="502.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">asyncio.gather</text>
<text x="300.0" y="518.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#222222" text-anchor="middle">chamadas em paralelo</text>
<rect x="30" y="576" width="190" height="66" rx="4" ry="4" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.6"/>
<text x="125.0" y="605.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">Ensembl</text>
<text x="125.0" y="621.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#222222" text-anchor="middle">overlap de variantes</text>
<rect x="240" y="576" width="190" height="66" rx="4" ry="4" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.6"/>
<text x="335.0" y="605.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">gnomAD</text>
<text x="335.0" y="621.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#222222" text-anchor="middle">restrição do gene</text>
<rect x="450" y="576" width="190" height="66" rx="4" ry="4" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.6"/>
<text x="545.0" y="605.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">UniProt</text>
<text x="545.0" y="621.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#222222" text-anchor="middle">identificador</text>
<rect x="450" y="700" width="190" height="66" rx="4" ry="4" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.6"/>
<text x="545.0" y="729.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">AlphaFold</text>
<text x="545.0" y="745.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#222222" text-anchor="middle">estrutura 3D</text>
<rect x="180" y="836" width="240" height="66" rx="4" ry="4" fill="#d5e8d4" stroke="#82b366" stroke-width="1.6"/>
<text x="300.0" y="857.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">Agrega, classifica e prioriza</text>
<text x="300.0" y="873.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">variantes</text>
<text x="300.0" y="889.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#222222" text-anchor="middle">(no servidor)</text>
<rect x="180" y="946" width="240" height="62" rx="4" ry="4" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.6"/>
<text x="300.0" y="973.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">Grava no cache (TTL 1 h)</text>
<text x="300.0" y="989.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#222222" text-anchor="middle">monta JSON único</text>
<rect x="180" y="1050" width="240" height="50" rx="12" ry="12" fill="#f5f5f5" stroke="#666666" stroke-width="1.6"/>
<text x="300.0" y="1071.0" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#222222" text-anchor="middle">Resposta ao navegador</text>
<text x="300.0" y="1087.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#222222" text-anchor="middle">JSON</text>
<rect x="560" y="300" width="310" height="188" rx="8" fill="#ffffff" stroke="#b3b3b3" stroke-width="1.4"/><text x="574" y="321" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#222222">Chave do cache</text><text x="574" y="337" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#444444">gene:v6:{símbolo}:{com|sem}. O recorte com ou sem</text><text x="574" y="353" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#444444">variantes faz parte da chave: são duas respostas</text><text x="574" y="369" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#444444">diferentes, e não uma podada depois de lida.</text><text x="574" y="401" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#222222">Rotas irmãs da mesma origem</text><text x="574" y="417" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#444444">GET /{símbolo}/variants  ·  genevars:v1</text><text x="574" y="433" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#444444">GET /{símbolo}/phenotypes  ·  genephen:v2</text><text x="574" y="449" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#444444">GET /api/variant/{rs}  ·  variant:v3, e acrescenta</text><text x="574" y="465" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#444444">ClinVar (E-utilities) e MyVariant.info.</text><polyline points="300.0,116.0 300.0,150.0" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#arr)"/>
<polyline points="300.0,204.0 300.0,240.0" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#arr)"/>
<polyline points="235.0,292.0 180.0,291.0" fill="none" stroke="#555555" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="161.6" y="238.0" width="86.8" height="18" rx="9" fill="#ffffff" stroke="#555555" stroke-width="0.8" opacity="0.95"/>
<text x="205.0" y="251.0" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#333" text-anchor="middle">hit · ~16 ms</text>
